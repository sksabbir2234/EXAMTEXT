<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Upload - CSE Exams</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .upload-log { background:#1a1a2e; color:#0f0; padding:16px; border-radius:8px; font-family:monospace; font-size:0.85rem; max-height:400px; overflow-y:auto; margin-top:16px; }
    .log-entry { margin-bottom:4px; }
    .log-success { color:#0f0; }
    .log-error { color:#f44; }
    .log-info { color:#0af; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Auto Upload - CSE College Teacher Exams</h1>
    <p>Upload all 10 CSE chapter exams at once (30 MCQs each)</p>
  </div>
  <div class="container">
    <div class="admin-section">
      <h2>Ready to Upload</h2>
      <p>Click below to upload all 10 CSE chapter exams to Firebase.</p>
      <button class="btn btn-primary btn-block" id="upload-btn" style="margin-top:16px;">Upload All 10 CSE Exams</button>
      <div class="upload-log" id="log" style="display:none;"></div>
    </div>
  </div>
  <script type="module" src="js/auto-upload-cse.js"></script>
</body>
</html>
