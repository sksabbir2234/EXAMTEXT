<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSE College Teacher - Exams</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .exam-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:#fff; border-radius:10px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,0.06); flex-wrap:wrap; gap:10px; }
    .exam-row:hover { box-shadow:0 2px 8px rgba(0,0,0,0.12); }
    .exam-name { font-weight:600; font-size:0.95rem; color:#333; flex:1; min-width:200px; }
    .exam-meta { font-size:0.8rem; color:#888; min-width:100px; }
    .link-box { display:flex; gap:6px; align-items:center; }
    .link-input { padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:0.8rem; width:200px; background:#f9f9f9; }
    .copy-btn { padding:6px 12px; background:#667eea; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600; }
    .copy-btn:hover { background:#5566cc; }
    .share-btns { display:flex; gap:4px; }
    .share-sm { padding:5px 10px; border:none; border-radius:5px; color:#fff; font-size:0.75rem; cursor:pointer; font-weight:600; }
    .share-sm.fb { background:#1877f2; }
    .share-sm.wa { background:#25d366; }
    .share-sm:hover { opacity:0.85; }
    @media(max-width:600px) { .exam-row { flex-direction:column; align-items:flex-start; } .link-input { width:100%; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>CSE College Teacher - Exams</h1>
    <p>Shareable links for all chapters</p>
  </div>
  <div class="container" id="exams-list">
    <div class="loading"><div class="spinner"></div><p>Loading exams...</p></div>
  </div>
  <script type="module" src="js/cse-exams.js"></script>
</body>
</html>
