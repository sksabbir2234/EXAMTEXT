<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Exam Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>Admin Panel</h1>
    <p>Upload and manage exams</p>
  </div>
  <div class="container">
    <div class="admin-section">
      <h2>Upload Exam JSON</h2>
      <div class="form-group">
        <label>Choose JSON file</label>
        <input type="file" id="json-file" accept=".json">
      </div>
      <div class="form-group">
        <label>Or paste JSON here</label>
        <textarea id="json-text" placeholder='{"subject":"HSC ICT","examTitle":"Chapter 3","durationMinutes":20,"questions":[...]}'></textarea>
      </div>
      <button class="btn btn-primary" id="preview-btn">Preview</button>
      <div id="preview-area" style="display:none;margin-top:16px;">
        <div class="upload-preview" id="preview-content"></div>
        <button class="btn btn-success" id="confirm-btn" style="margin-top:12px;">Confirm Upload</button>
      </div>
      <div id="upload-result" style="margin-top:16px;"></div>
    </div>

    <div class="admin-section">
      <h2>Existing Subjects & Exams</h2>
      <div id="manage-list">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
